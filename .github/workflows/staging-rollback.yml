name: Staging Rollback

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target commit SHA to rollback to'
        required: true
        default: ''

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Validate target SHA
      run: |
        git rev-parse --verify ${{ github.event.inputs.target_sha }} > /dev/null 2>&1 || { echo "Invalid SHA: ${{ github.event.inputs.target_sha }}"; exit 1; }
        echo "Valid target SHA: ${{ github.event.inputs.target_sha }}"

    - name: Stop existing staging container
      run: |
        docker stop game-collection-manager-staging || true
        docker rm game-collection-manager-staging || true
        echo "Cleaned up existing staging container"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run backend tests
      run: |
        cd backend
        pytest

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Run frontend build
      run: |
        cd frontend
        npm run build

    - name: Build Docker image for target SHA
      env:
        COMMIT_SHA: ${{ github.event.inputs.target_sha }}
      run: |
        git checkout ${{ github.event.inputs.target_sha }}
        docker build -t game-collection-manager-rollback:${{ github.event.inputs.target_sha }} .
        echo "Built image for target SHA: ${{ github.event.inputs.target_sha }}"

    - name: Deploy rollback to staging
      run: |
        echo "Starting staging container with target SHA..."
        docker run -d --name game-collection-manager-staging -p 8000:8000 -e COMMIT_SHA=${{ github.event.inputs.target_sha }} game-collection-manager-rollback:${{ github.event.inputs.target_sha }} || { echo "Failed to start container"; exit 1; }
        echo "Container started successfully"

    - name: Wait for application to be ready
      run: |
        sleep 10
        for i in {1..30}; do
          if curl -s http://localhost:8000/health | grep '"status":"healthy"'; then
            echo "Application is healthy"
            exit 0
          fi
          echo "Waiting for application to be ready... ($i/30)"
          sleep 2
        done
        echo "Application failed to become healthy"
        exit 1

    - name: Verify version endpoint matches target
      run: |
        VERSION_RESPONSE=$(curl -s http://localhost:8000/version)
        echo "Version response: $VERSION_RESPONSE"
        echo "$VERSION_RESPONSE" | grep '"commit":"${{ github.event.inputs.target_sha }}"'

    - name: Report rollback info
      run: |
        echo "STAGING ROLLBACK COMPLETE"
        echo "Target SHA: ${{ github.event.inputs.target_sha }}"
        echo "Status: SUCCESS"
        echo "Health: PASS"
        echo "Deployed version: ${{ github.event.inputs.target_sha }}"